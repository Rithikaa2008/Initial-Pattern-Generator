name: Run C Program

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile C program
        run: gcc Main.c -o pattern

      - name: Run C program
        run: ./pattern
